{% extends 'estoque/base.html' %}{% block content %}<div class="heading"><h1>{{ titulo }}</h1></div><section class="panel form">{% if form.non_field_errors %}{{ form.non_field_errors }}{% endif %}<form method="post">{% csrf_token %}{% for field in form %}<label>{{ field.label }}{{ field }}{% for error in field.errors %}<small class="error">{{ error }}</small>{% endfor %}</label>{% endfor %}<button class="btn">Salvar</button> <a class="btn muted" href="javascript:history.back()">Cancelar</a></form></section>{% endblock %}
