{% extends 'estoque/base.html' %}{% block content %}<div class="heading"><h1>Categorias</h1><a class="btn" href="{% url 'estoque:categoria_criar' %}">+ Nova categoria</a></div><section class="panel"><table><tr><th>Nome</th><th>Descrição</th><th>Ações</th></tr>{% for x in categorias %}<tr><td>{{ x.nome }}</td><td>{{ x.descricao|default:'—' }}</td><td><a href="{% url 'estoque:categoria_editar' x.pk %}">Editar</a> · <a href="{% url 'estoque:categoria_excluir' x.pk %}">Excluir</a></td></tr>{% empty %}<tr><td colspan="3">Nenhuma categoria cadastrada.</td></tr>{% endfor %}</table></section>{% endblock %}
