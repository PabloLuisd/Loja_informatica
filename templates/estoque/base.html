{% load static %}<!doctype html><html lang="pt-br"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}ByteStore{% endblock %}</title><link rel="stylesheet" href="{% static 'estoque/style.css' %}"></head><body>
<header><a class="logo" href="{% url 'estoque:dashboard' %}">ByteStore <span>Estoque</span></a><nav><a href="{% url 'estoque:dashboard' %}">Início</a><a href="{% url 'estoque:produto_lista' %}">Produtos</a><a href="{% url 'estoque:categoria_lista' %}">Categorias</a><a href="{% url 'estoque:fornecedor_lista' %}">Fornecedores</a><a href="{% url 'estoque:movimentacao_lista' %}">Movimentações</a></nav></header>
