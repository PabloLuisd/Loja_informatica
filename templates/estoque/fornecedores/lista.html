{% extends 'estoque/base.html' %}{% block content %}<div class="heading"><h1>Fornecedores</h1><a class="btn" href="{% url 'estoque:fornecedor_criar' %}">+ Novo fornecedor</a></div><section class="panel"><table><tr><th>Nome</th><th>CNPJ</th><th>Telefone</th><th>E-mail</th><th>Ações</th></tr>{% for x in fornecedores %}<tr><td>{{ x.nome }}</td><td>{{ x.cnpj }}</td><td>{{ x.telefone }}</td><td>{{ x.email }}</td><td><a href="{% url 'estoque:fornecedor_editar' x.pk %}">Editar</a> · <a href="{% url 'estoque:fornecedor_excluir' x.pk %}">Excluir</a></td></tr>{% empty %}<tr><td colspan="5">Nenhum fornecedor cadastrado.</td></tr>{% endfor %}</table></section>{% endblock %}
